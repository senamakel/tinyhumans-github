# Builds ghcr.io/tinyhumansai/rust_ci from images/rust-ci/Dockerfile: the
# toolbox Rust workspaces run their CI jobs in (`container:`). Pull requests
# build it without pushing; main pushes it whenever its inputs change.
name: Rust CI image
on:
  push:
    branches: [main]
    paths:
      - images/rust-ci/**
      - .github/workflows/rust-ci-image.yml
  pull_request:
    paths:
      - images/rust-ci/**
      - .github/workflows/rust-ci-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: rust-ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '7.0'
            version: '7.0.45'
            pnpm: '10.10.0'
            fingerprint: E58830201F7DD82CD808AA84160D26BB1785BA38
            tag: ''
          - mongodb: '8.0'
            version: '8.0.34'
            pnpm: '10.34.5'
            fingerprint: 4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05
            tag: 'mongo8-'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the default mold linker
        run: bash images/rust-ci/test-mold-linker.sh
      - name: Read the image's Rust version
        id: meta
        run: |
          set -euo pipefail
          rust="$(sed -n 's/^ARG RUST_STABLE=//p' images/rust-ci/Dockerfile)"
          [ -n "${rust}" ] || { echo "no ARG RUST_STABLE in the Dockerfile" >&2; exit 1; }
          echo "rust=${rust}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/rust-ci
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          build-args: |
            PNPM_VERSION=${{ matrix.pnpm }}
            MONGODB_MAJOR=${{ matrix.mongodb }}
            MONGODB_VERSION=${{ matrix.version }}
            MONGODB_KEY_FINGERPRINT=${{ matrix.fingerprint }}
          # The sha tag names the commit `latest` was built from; pin it.
          tags: |-
            ghcr.io/tinyhumansai/rust_ci:${{ matrix.tag }}latest
            ghcr.io/tinyhumansai/rust_ci:${{ matrix.tag }}rust-${{ steps.meta.outputs.rust }}
            ghcr.io/tinyhumansai/rust_ci:${{ matrix.tag }}sha-${{ github.sha }}
