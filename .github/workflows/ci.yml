name: Shared workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/test-workflow-msrv.py
      - run: python3 scripts/test-source-assets.py
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/test-sdk-release.py
