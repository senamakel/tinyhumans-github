name: TinyHumans module CI

on:
  workflow_call:
    inputs:
      coverage-command:
        description: Command that enforces the shared per-file coverage threshold.
        type: string
        required: true
      msrv:
        description: Deprecated compatibility input; MSRV is read from Cargo.toml.
        type: string
        default: ''
      msrv-build-targets:
        description: Optional validated Cargo build groups for the declared MSRV.
        type: string
        default: ''
      module-e2e-command:
        description: Command that runs the module loader end-to-end suite.
        type: string
        required: true
      feature-test-command:
        description: Command that runs the module's feature-level test suite.
        type: string
        required: true
      apt-packages:
        description: Additional Ubuntu packages required by the module.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: ${{ inputs.coverage-command }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - id: msrv
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --quiet | jq -er '
            .workspace_root as $root
            | [.packages[] | select(.manifest_path == ($root + "/Cargo.toml")) | .rust_version]
            | first // error("workspace root package must declare rust-version")
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - name: Build with the declared MSRV
        shell: bash
        env:
          MSRV_BUILD_TARGETS: ${{ inputs.msrv-build-targets }}
        run: |
          if [[ -z "$MSRV_BUILD_TARGETS" ]]; then
            cargo build --workspace --all-targets --all-features
            exit
          fi
          jq -e '
            type == "array" and length > 0 and all(.[];
              (.packages | type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$"))) and
              ((.features // []) | type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$"))) and
              ((.all_targets // false) | type == "boolean") and
              ((.all_features // false) | type == "boolean") and
              ((.no_default_features // false) | type == "boolean")
            )
          ' <<< "$MSRV_BUILD_TARGETS" >/dev/null
          while IFS= read -r target; do
            args=()
            while IFS= read -r package; do args+=(--package "$package"); done \
              < <(jq -r '.packages[]' <<< "$target")
            while IFS= read -r feature; do args+=(--features "$feature"); done \
              < <(jq -r '.features[]?' <<< "$target")
            [[ "$(jq -r '.all_targets // false' <<< "$target")" == true ]] && args+=(--all-targets)
            [[ "$(jq -r '.all_features // false' <<< "$target")" == true ]] && args+=(--all-features)
            [[ "$(jq -r '.no_default_features // false' <<< "$target")" == true ]] && args+=(--no-default-features)
            cargo build "${args[@]}"
          done < <(jq -c '.[]' <<< "$MSRV_BUILD_TARGETS")

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2

  module-e2e:
    name: module-e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - id: msrv
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --quiet | jq -er '
            .workspace_root as $root
            | ($root + "/Cargo.toml" | gsub("\\\\"; "/")) as $manifest
            | [.packages[] | select((.manifest_path | gsub("\\\\"; "/")) == $manifest) | .rust_version]
            | first // error("workspace root package must declare rust-version")
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - shell: bash
        run: ${{ inputs.module-e2e-command }}

  feature-tests:
    name: feature-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ inputs.apt-packages }}
      - shell: bash
        run: ${{ inputs.feature-test-command }}
